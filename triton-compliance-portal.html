          <Field label="New password" required><TextInput type="password" value={newPassword} onChange={setNewPassword}/></Field>
          <Field label="Confirm new password" required><TextInput type="password" value={confirmPassword} onChange={setConfirmPassword}/></Field>
          {error && <div className="bg-red-50 border border-red-200 text-red-700 rounded p-3 text-sm">{error}</div>}
          {message && <div className="bg-green-50 border border-green-200 text-green-700 rounded p-3 text-sm">{message}</div>}

          </div>
        </form>
      </div>
    </div>
  );
};

const App = () => {
  /* -- drafts state (lazy init bootstraps from localStorage or makes a blank one) -- */
  const [drafts, setDrafts] = useState(() => {
    const loaded = loadDraftsList();
    return loaded.length ? loaded : [makeDraft()];
  });
  const [activeDraftId, setActiveDraftId] = useState(() => {
    const loaded = loadDraftsList();
    if (loaded.length) return loaded[0].id;
    return null;       // first render's makeDraft() inside drafts init will be picked up below
  });
  const [saveMsg, setSaveMsg] = useState("");
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [portalUnlocked, setPortalUnlocked] = useState(() => isPortalUnlocked());
  const [changePasswordOpen, setChangePasswordOpen] = useState(false);

  /* Ensure activeDraftId always points at a real draft */
  useEffect(() => {
    if (!drafts.length) return;
    if (!drafts.some(d => d.id === activeDraftId)) setActiveDraftId(drafts[0].id);
  }, [drafts, activeDraftId]);

  /* Persist on every change */
  useEffect(() => { saveDraftsList(drafts); }, [drafts]);

  /* -- derived state for the active draft -- */
  const activeDraft = useMemo(
    () => drafts.find(d => d.id === activeDraftId) || drafts[0] || makeDraft(),
    [drafts, activeDraftId]
  );
  const formData = activeDraft.formData;
  const currentStepIdx = activeDraft.currentStep || 0;

  const steps = useMemo(() => buildSteps(formData), [formData]);

  /* Adjust current step if it falls outside available steps after a flow change */
  useEffect(() => {
    if (currentStepIdx >= steps.length) {
      updateActiveDraft({ currentStep: Math.max(0, steps.length - 1) });
    }
  }, [steps.length]);

  /* ---- helpers that mutate the active draft ---- */
  const updateActiveDraft = useCallback((patch) => {
    setDrafts(ds => ds.map(d => d.id === activeDraftId
      ? { ...d, ...patch, updatedAt: Date.now() }
      : d
    ));
  }, [activeDraftId]);

  const update = useCallback((section, value) => {
    setDrafts(ds => ds.map(d => d.id === activeDraftId
      ? { ...d, formData: { ...d.formData, [section]: value }, updatedAt: Date.now() }
      : d
    ));
  }, [activeDraftId]);

  const markManualNamePath = useCallback((path) => {
    setDrafts(ds => ds.map(d => {
      if (d.id !== activeDraftId) return d;
      const smartFill = d.formData.smartFill || { manual: {} };
      return {
        ...d,
        formData: {
          ...d.formData,
          smartFill: {
            ...smartFill,
            manual: { ...(smartFill.manual || {}), [path]: true },
          },
        },
        updatedAt: Date.now(),
      };
    }));
  }, [activeDraftId]);

  useEffect(() => {
    if (!formData) return;
    const ad = formData.advisorDisclosure || {};
    const primaryName = fullClientName(ad);
    const spouseName = (ad.client2Name || "").trim();
    const smartFill = formData.smartFill || { manual: {} };
    const manual = smartFill.manual || {};
    const lastPrimaryName = smartFill.lastPrimaryName || "";
    const lastSpouseName = smartFill.lastSpouseName || "";
    const targets = getSmartNameTargets(formData, primaryName, spouseName);
    const previousTargetValues = Object.fromEntries(getSmartNameTargets(
      { advisorDisclosure: { clientName: lastPrimaryName, client1Name: lastPrimaryName, client2Name: lastSpouseName } },
      lastPrimaryName,
      lastSpouseName
    ));

    let nextFormData = formData;
    let changed = false;
    targets.forEach(([path, value]) => {
      if (!value || manual[path]) return;
      const current = getPath(nextFormData, path) || "";
      const previousAuto = previousTargetValues[path] || "";
      const looksLikePartialAutoFill = current && value.startsWith(current) && current.length < value.length;
      if (!current || current === previousAuto || looksLikePartialAutoFill) {
        nextFormData = setPathImmutable(nextFormData, path, value);
        changed = true;
      }
    });

    if (primaryName !== lastPrimaryName || spouseName !== lastSpouseName) {
      nextFormData = {
        ...nextFormData,
        smartFill: { ...smartFill, manual, lastPrimaryName: primaryName, lastSpouseName: spouseName },
      };
      changed = true;
    }
    if (changed) updateActiveDraft({ formData: nextFormData });
  }, [
    formData?.advisorDisclosure?.clientName,
    formData?.advisorDisclosure?.client1Name,
    formData?.advisorDisclosure?.client2Name,
    activeDraftId,
  ]);

  const setCurrentStepIdx = useCallback((idx) => {
    updateActiveDraft({ currentStep: idx });
  }, [updateActiveDraft]);

  const goToStepByKey = (key) => {
    const i = steps.findIndex(s => s.key === key);
    setCurrentStepIdx(i >= 0 ? i : 0);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const next = () => {
    if (currentStepIdx < steps.length - 1) {
      setCurrentStepIdx(currentStepIdx + 1);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  };
  const prev = () => {
    if (currentStepIdx > 0) {
      setCurrentStepIdx(currentStepIdx - 1);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  };

  /* ---- draft management actions ---- */
  const handleNewDraft = () => {
    const nd = makeDraft();
    setDrafts(ds => [nd, ...ds]);   // newest on top
    setActiveDraftId(nd.id);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const handleSwitchDraft = (id) => {
    // Current state is already auto-persisted via useEffect, so just switch.
    setActiveDraftId(id);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const handleDeleteDraft = (id) => {
    const d = drafts.find(x => x.id === id);
    const name = d ? (getDraftClientName(d) || "this unnamed draft") : "this draft";
    if (!confirm(`Delete ${name}? This cannot be undone.`)) return;
    setDrafts(ds => {
      const next = ds.filter(x => x.id !== id);
      // If we just deleted the last one, seed with a blank
      if (next.length === 0) {
        const blank = makeDraft();
        setActiveDraftId(blank.id);
        return [blank];
      }
      if (id === activeDraftId) setActiveDraftId(next[0].id);
      return next;
    });
  };

  const handleSaveDraft = () => {
    saveDraftsList(drafts);    // also auto-persisted, but show feedback
    setSaveMsg("Draft saved · 已保存");
    setTimeout(() => setSaveMsg(""), 2500);
  };

  const handleResetAll = () => {
    if (!confirm("This will erase ALL drafts and reset the entire portal. Continue?")) return;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(STORAGE_KEY_LEGACY);
    const blank = makeDraft();
    setDrafts([blank]);
    setActiveDraftId(blank.id);
  };

  const currentStep = steps[currentStepIdx];
  const stepKey = currentStep?.key;

  const renderStep = () => {
    switch (stepKey) {
      case "advisorDisclosure": return <AdvisorDisclosureForm data={formData} update={update}/>;
      case "businessType":      return <BusinessTypeSelection data={formData} update={update}/>;
      case "leverageSelection": return <LeverageLoanSelection data={formData} update={update}/>;
      case "leverageCompliance":return <LeverageComplianceForm data={formData} update={update} markManualNamePath={markManualNamePath}/>;
      case "nonLeverageCompliance": return <NonLeverageComplianceForm data={formData} update={update} markManualNamePath={markManualNamePath}/>;
      case "insuranceSelection":return <InsuranceCompanySelection data={formData} update={update}/>;
      case "manulife":          return <ManulifeQuestionnaire data={formData} update={update} markManualNamePath={markManualNamePath}/>;
      case "iaFinancial":       return <IAFinancialQuestionnaire data={formData} update={update} markManualNamePath={markManualNamePath}/>;
      case "canadaLife":        return <CanadaLifeQuestionnaire data={formData} update={update} markManualNamePath={markManualNamePath}/>;
      case "equitableLife":     return <EquitableLifeQuestionnaire data={formData} update={update} markManualNamePath={markManualNamePath}/>;
      case "needsAnalysis":     return <LifeInsuranceNeedsAnalysisForm data={formData} update={update} markManualNamePath={markManualNamePath}/>;
      case "review":            return <ReviewAndGeneratePDF data={formData} goToStep={goToStepByKey} update={update}/>;
      default:                  return <div className="text-center text-gray-500 py-10">Loading...</div>;
    }
  };

  const canProceed = () => {
    if (stepKey === "businessType" && !formData.businessType) return false;
    if (stepKey === "leverageSelection" && !formData.segregatedFundInvestment.leverageLoan) return false;
    if (stepKey === "insuranceSelection" && !formData.segregatedFundInvestment.selectedInsuranceCompany) return false;
    return true;
  };

  const handleLogout = () => {
    sessionStorage.removeItem(AUTH_KEY);
    localStorage.removeItem(AUTH_KEY);
    setPortalUnlocked(false);
  };

  if (!portalUnlocked) {
    return <LoginScreen onLogin={() => setPortalUnlocked(true)}/>;
  }

  const showHero = currentStepIdx === 0;

  return (
    <div className="min-h-screen" style={{ background: "var(--c-cream)" }}>
      <ChangePasswordModal open={changePasswordOpen} onClose={() => setChangePasswordOpen(false)}/>
      {/* ===== Header ===== */}
      <header className="app-header no-print">
        <div className="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div className="flex items-center gap-4">
            <img src={window.TRITON_LOGO_COVER || window.TRITON_LOGO || "./Triton Logo 2.png"} alt="Triton Wealth Management 富瑞财富" className="logo-mark"/>
            <div className="hidden md:block border-l border-white/15 pl-4">
              <div className="en-label" style={{ color: "var(--c-gold)" }}>Triton Wealth Management · 富瑞财富</div>
              <div className="text-white" style={{ fontFamily: "var(--f-sans)", fontSize: "1.02rem", fontStyle: "normal", letterSpacing: "0" }}>
                Compliance Form Portal
              </div>
            </div>
          </div>
          <div className="flex flex-wrap items-center gap-3 text-xs">
            {saveMsg && <span className="text-green-300 serif-italic">{saveMsg}</span>}
            <button onClick={handleSaveDraft}
              className="px-4 py-2 text-xs uppercase tracking-widest font-medium border border-[#C9A961] text-[#C9A961] rounded hover:bg-[#C9A961] hover:text-[#0B1E3F] transition">
              Save Draft
            </button>
            <button onClick={() => setChangePasswordOpen(true)} className="px-4 py-2 text-xs uppercase tracking-widest font-medium border border-white/35 text-white rounded hover:bg-white hover:text-[#0B1E3F] transition">Change Password</button>
            <button onClick={handleLogout} className="px-4 py-2 text-xs uppercase tracking-widest font-medium border border-white/35 text-white rounded hover:bg-white hover:text-[#0B1E3F] transition">Logout</button>
            <button onClick={handleResetAll} className="btn-danger uppercase tracking-widest">Reset</button>
          </div>
        </div>
      </header>

      {/* ===== Step navigation ===== */}
      <div className="step-nav-bar no-print">
        <div className="max-w-7xl mx-auto px-6 py-3 overflow-x-auto">
          <div className="flex flex-nowrap gap-2 min-w-max items-center">
            <span className="en-label hidden md:inline mr-3">Progress</span>
            {steps.map((s, idx) => {
              const cls = idx === currentStepIdx ? "active" : idx < currentStepIdx ? "done" : "todo";
              return (
                <button key={s.key} onClick={() => setCurrentStepIdx(idx)} className={`nav-step ${cls}`}>
                  <span>{idx < currentStepIdx ? "✓ " : ""}{s.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {/* ===== Main content (dual-column on desktop) ===== */}
      <main className="max-w-7xl mx-auto px-4 md:px-6 py-8">
        <div className="grid grid-cols-12 gap-6">

          {/* Left rail — drafts */}
          <div className="col-span-12 lg:col-span-3">
            <DraftsSidebar
              drafts={drafts}
              activeDraftId={activeDraftId}
              onSwitch={handleSwitchDraft}
              onCreate={handleNewDraft}
              onDelete={handleDeleteDraft}
              collapsed={sidebarCollapsed}
              onToggleCollapsed={() => setSidebarCollapsed(c => !c)}
            />
          </div>

          {/* Right column — form */}
          <div className="col-span-12 lg:col-span-9">
            {showHero && (
              <div className="hero-banner mb-6 no-print">
                <div className="en-label" style={{ color: "var(--c-gold)" }}>Welcome · 欢迎</div>
                <h2>
                  专业 · 严谨 · <span className="accent">合规优先</span>
                </h2>
                <p>
                  本系统用于 Triton Wealth Management 顾问完成客户合规文件签署流程。请按步骤完成所有必填栏目，系统会自动整合所有表单生成正式 PDF，可直接下载并发送给客户签字。

                  <span>· 客户尽职调查 KYC</span>
                  <span>· 投资问卷 Suitability</span>
                  <span>· 保险需求分析 Needs Analysis</span>

                )}

              <div className="flex items-center gap-3">
                <button onClick={handleSaveDraft} className="btn-ghost">Save Draft</button>
                {currentStepIdx < steps.length - 1 && (
                  <button onClick={next} disabled={!canProceed()}
                    className="btn-primary disabled:opacity-40 disabled:cursor-not-allowed">
                    Next →
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      </main>

      {/* ===== Footer ===== */}
      <footer className="app-footer no-print mt-10">
        <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div className="flex items-center gap-3">
            <img src={window.TRITON_LOGO_COVER || window.TRITON_LOGO || "./Triton Logo 2.png"} alt="Triton" className="footer-logo"/>
            <div className="text-xs">
              <div style={{ color: "var(--c-cream)" }}>Triton Wealth Management Corporation · 富瑞财富</div>
              <div style={{ color: "rgba(245, 242, 235, 0.55)" }}>#1200 1200 W 73rd Ave Vancouver, BC V6P 6G5 · (778) 837-6688</div>
            </div>
          </div>
          <div className="text-xs uppercase tracking-widest" style={{ color: "rgba(245, 242, 235, 0.55)" }}>
            © {new Date().getFullYear()} Compliance Form Portal
          </div>
        </div>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
