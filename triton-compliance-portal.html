<style>
  :root {
    /* === Triton brand palette (extracted from tritonwealth.ca) === */
    --c-bg-deep:   #0B1E3F;
    --c-bg-dark:   #0E1117;
    --c-bg-panel:  #122A4F;
    --c-cream:     #F5F2EB;
    --c-cream-deep:#EBE4D3;
    --c-gold:      #C9A961;
    --c-gold-soft: #D9BE7E;
    --c-text:      #1B2230;
    --c-text-soft: #4A5365;
    --c-muted:     #8A93A6;
    --c-line:      rgba(201, 169, 97, 0.35);
    --c-line-soft: rgba(11, 30, 63, 0.10);

    --f-serif: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --f-sans:  "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

    --shadow-soft: 0 10px 40px rgba(11, 30, 63, 0.08);
    --shadow-card: 0 4px 24px rgba(11, 30, 63, 0.06);

    /* Legacy aliases retained for existing utility classes */
    --navy: #0B1E3F;
    --navy-light: #122A4F;
    --gold: #C9A961;
    --gold-light: #D9BE7E;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--f-sans);
    background: var(--c-cream);
    color: var(--c-text);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { font-family: var(--f-sans); font-weight: 650; color: var(--c-bg-deep); letter-spacing: 0; }
  .en-label {
    font-family: var(--f-sans); font-size: 0.7rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--c-gold); font-weight: 500;
  }
  .serif-italic { font-family: var(--f-sans); font-style: normal; font-weight: 400; }

  /* Utility re-bindings so old class names use new palette */
  .text-navy { color: var(--c-bg-deep) !important; }
  .bg-navy   { background-color: var(--c-bg-deep) !important; }
  .bg-navy-light { background-color: var(--c-bg-panel) !important; }
  .text-gold { color: var(--c-gold) !important; }
  .bg-gold   { background-color: var(--c-gold) !important; }
  .border-navy { border-color: var(--c-bg-deep) !important; }
  .border-gold { border-color: var(--c-gold) !important; }
  .hover\:bg-navy-light:hover { background-color: var(--c-bg-panel) !important; }
  .hover\:bg-gold-light:hover { background-color: var(--c-gold-soft) !important; }

  /* Inputs */
  input[type="text"], input[type="email"], input[type="date"], input[type="number"], input[type="tel"], textarea, select {
    border: 1px solid #cbd5e1; border-radius: 4px; padding: 8px 12px; width: 100%; font-size: 14px;
    background: #fff; color: var(--c-text); transition: border-color .15s, box-shadow .15s;
    font-family: var(--f-sans);
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--c-gold);
    box-shadow: 0 0 0 3px rgba(201, 169, 97, 0.18);
  }

  .label-req::after { content: " *"; color: #b91c1c; font-weight: 600; }

  /* Section / panel headers */
  .section-header {
    background: var(--c-bg-deep); color: #fff; padding: 11px 16px;
    font-family: var(--f-sans); font-weight: 600; font-size: 13px;
    letter-spacing: 0.06em; text-transform: uppercase;
    border-radius: 4px 4px 0 0;
    border-left: 3px solid var(--c-gold);
  }
  .section-header-light {
    background: var(--c-cream-deep); color: var(--c-bg-deep);
    padding: 9px 14px; font-family: var(--f-sans); font-weight: 600; font-size: 12px;
    letter-spacing: 0.06em; text-transform: uppercase;
    border-left: 3px solid var(--c-gold);
  }

  /* Top header bar */
  .app-header {
    background: var(--c-bg-deep);
    background-image: linear-gradient(135deg, #0B1E3F 0%, #122A4F 100%);
    color: #fff;
    border-bottom: 2px solid var(--c-gold);
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .app-header .logo-mark { height: 52px; width: auto; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35)); }

  /* Step navigation pills */
  .step-nav-bar {
    background: #fff;
    border-bottom: 1px solid var(--c-line-soft);
    box-shadow: 0 2px 8px rgba(11, 30, 63, 0.04);
  }
  .nav-step {
    display: flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: 999px; font-size: 12.5px; font-weight: 500;
    transition: all .15s; cursor: pointer; border: 1px solid transparent;
    font-family: var(--f-sans); white-space: nowrap;
  }
  .nav-step.active { background: var(--c-gold); color: var(--c-bg-deep); font-weight: 600; box-shadow: 0 2px 8px rgba(201, 169, 97, 0.35); }
  .nav-step.done   { background: var(--c-bg-deep); color: #fff; }
  .nav-step.todo   { background: var(--c-cream); color: var(--c-text-soft); border-color: var(--c-line-soft); }
  .nav-step.todo:hover { background: var(--c-cream-deep); color: var(--c-bg-deep); }

  /* Buttons */
  .btn-primary {
    background: var(--c-gold); color: var(--c-bg-deep);
    padding: 10px 22px; font-weight: 600; border-radius: 4px;
    font-family: var(--f-sans); font-size: 14px; letter-spacing: 0.02em;
    transition: all .15s; border: 1px solid var(--c-gold);
  }
  .btn-primary:hover { background: var(--c-gold-soft); box-shadow: 0 8px 22px rgba(201, 169, 97, 0.3); transform: translateY(-1px); }
  .btn-outline {
    background: transparent; color: var(--c-bg-deep);
    padding: 10px 22px; font-weight: 600; border-radius: 4px;
    font-family: var(--f-sans); font-size: 14px;
    border: 1px solid var(--c-bg-deep); transition: all .15s;
  }
  .btn-outline:hover { background: var(--c-bg-deep); color: #fff; }
  .btn-ghost {
    background: transparent; color: var(--c-bg-deep);
    padding: 8px 16px; font-weight: 500; border-radius: 4px;
    font-family: var(--f-sans); font-size: 13px;
    border: 1px solid var(--c-line-soft); transition: all .15s;
  }
  .btn-ghost:hover { background: var(--c-cream); border-color: var(--c-gold); }
  .btn-danger {
    background: transparent; color: #fca5a5; padding: 8px 14px; font-size: 12px;
    border: 1px solid rgba(252, 165, 165, 0.5); border-radius: 4px; transition: all .15s;
  }
  .btn-danger:hover { background: #b91c1c; color: #fff; border-color: #b91c1c; }

  /* Form cards */
  .form-card {
    background: #fff; border-radius: 6px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--c-line-soft);
  }

  /* Adobe Sign signature placeholder */
  .sig-placeholder {
    background: linear-gradient(135deg, #fffaf0 0%, #fff3c4 100%);
    border: 1px dashed var(--c-gold);
    border-radius: 4px;
    min-height: 82px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--c-bg-deep);
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  /* Choice cards for business-type / leverage / insurance company selection */
  .choice-card {
    background: #fff; border: 1.5px solid var(--c-line-soft);
    border-radius: 6px; padding: 24px; cursor: pointer;
    transition: all .2s; text-align: left;
    box-shadow: var(--shadow-card);
  }
  .choice-card:hover {
    border-color: var(--c-gold); transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(11, 30, 63, 0.1);
  }
  .choice-card.selected {
    border-color: var(--c-gold); background: linear-gradient(135deg, #fff 0%, #FBF6E8 100%);
    box-shadow: 0 8px 28px rgba(201, 169, 97, 0.25);
  }
  .choice-card .choice-en { font-family: var(--f-sans); font-style: normal; color: var(--c-text-soft); font-size: 0.85rem; margin-bottom: 4px; }
  .choice-card .choice-title { font-family: var(--f-sans); font-size: 1.25rem; color: var(--c-bg-deep); font-weight: 650; line-height: 1.2; }
  .choice-card .choice-desc { font-size: 0.85rem; color: var(--c-text-soft); margin-top: 10px; line-height: 1.55; }

  /* Tables */
  table.kyc-table { width: 100%; border-collapse: collapse; }
  table.kyc-table th, table.kyc-table td { border: 1px solid #d8d3c4; padding: 8px 10px; font-size: 13px; vertical-align: top; }
  table.kyc-table th { background: var(--c-cream-deep); color: var(--c-bg-deep); text-align: left; font-weight: 600; font-family: var(--f-sans); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.kyc-table tr:nth-child(even) td { background: #fafaf6; }

  /* Hero banner (welcome on step 1) */
  .hero-banner {
    background: linear-gradient(135deg, #0B1E3F 0%, #122A4F 60%, #0B1E3F 100%);
    color: #fff; padding: 40px 32px; border-radius: 6px;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-soft);
  }
  .hero-banner::after {
    content: ""; position: absolute; right: -80px; top: -80px;
    width: 280px; height: 280px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201, 169, 97, 0.18) 0%, transparent 70%);
  }
  .hero-banner h2 { color: #fff; font-size: 1.9rem; line-height: 1.2; margin: 6px 0 12px; position: relative; z-index: 1; }
  .hero-banner h2 .accent { color: var(--c-gold); font-style: normal; }
  .hero-banner p { color: rgba(245, 242, 235, 0.85); font-size: 0.92rem; max-width: 680px; position: relative; z-index: 1; }

  /* Footer */
  .app-footer {
    background: var(--c-bg-deep); color: rgba(245, 242, 235, 0.7);
    border-top: 2px solid var(--c-gold);
    padding: 22px 0;
  }
  .app-footer .footer-logo { height: 40px; width: auto; opacity: 1; }

  /* Pdf preview content (offscreen) */
  .pdf-section { background: #fff; padding: 28px; }

  /* Gold divider */
  .gold-divider {
    height: 2px; width: 60px;
    background: linear-gradient(90deg, var(--c-gold), transparent);
    margin: 10px 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--c-line); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: var(--c-cream); }

  /* =================================================================
     DRAFTS SIDEBAR — left-rail listing all in-progress client forms
     ================================================================= */
  .drafts-sidebar {
    background: #fff; border-radius: 6px;
    box-shadow: var(--shadow-card);
    border: 1px solid var(--c-line-soft);
    border-left: 3px solid var(--c-gold);
    overflow: hidden;
    position: sticky; top: 16px;
    max-height: calc(100vh - 32px);
    display: flex; flex-direction: column;
  }
  .drafts-sidebar-header {
    padding: 16px 18px; border-bottom: 1px solid var(--c-line-soft);
    background: linear-gradient(180deg, #fff 0%, #FAFAF6 100%);
  }
  .drafts-sidebar-header .en-label { color: var(--c-gold); font-size: 0.65rem; }
  .drafts-sidebar-header h3 {
    font-family: var(--f-sans); font-size: 1.05rem; margin: 4px 0 0;
    color: var(--c-bg-deep); line-height: 1.2; font-weight: 600;
  }
  .new-draft-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; margin-top: 14px;
    background: var(--c-bg-deep); color: var(--c-gold);
    padding: 10px 14px; border-radius: 4px;
    font-family: var(--f-sans); font-size: 12px; letter-spacing: 0.08em;
    font-weight: 600; text-transform: uppercase; transition: all .15s;
    border: 1px solid var(--c-bg-deep);
  }
  .new-draft-btn:hover {
    background: var(--c-gold); color: var(--c-bg-deep);
    border-color: var(--c-gold);
    box-shadow: 0 6px 18px rgba(201, 169, 97, 0.3);
  }
  .new-draft-btn .plus-icon {
    width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .drafts-empty {
    padding: 32px 18px; text-align: center; color: var(--c-muted); font-size: 12px;
    font-family: var(--f-sans); font-style: normal;
  }
  .drafts-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  .draft-card {
    padding: 12px 14px; border-radius: 5px; cursor: pointer;
    margin-bottom: 6px; transition: all .18s ease;
    border: 1px solid transparent;
    position: relative; background: transparent;
  }
  .draft-card:hover { background: var(--c-cream); }
  .draft-card.active {
    background: linear-gradient(135deg, #0B1E3F 0%, #122A4F 100%);
    border-color: var(--c-gold);
    box-shadow: 0 6px 20px rgba(11, 30, 63, 0.22), inset 3px 0 0 var(--c-gold);
  }
  .draft-card.active .draft-name,
  .draft-card.active .draft-step-badge,
  .draft-card.active .draft-meta { color: inherit; }
  .draft-card .draft-card-row {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  }
  .draft-card .draft-name {
    font-weight: 600; font-size: 13.5px; color: var(--c-bg-deep);
    font-family: var(--f-sans); line-height: 1.25;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  .draft-card.active .draft-name { color: #fff; }
  .draft-card .draft-step-badge {
    display: inline-block; margin-top: 6px;
    font-size: 10px; padding: 2px 8px; border-radius: 999px;
    background: var(--c-cream-deep); color: var(--c-bg-deep);
    letter-spacing: 0.04em; font-weight: 500;
  }
  .draft-card.active .draft-step-badge {
    background: rgba(201, 169, 97, 0.22); color: var(--c-gold);
  }
  .draft-card .draft-meta {
    font-size: 10.5px; color: var(--c-muted); margin-top: 4px; font-family: var(--f-sans);
  }
  .draft-card.active .draft-meta { color: rgba(245, 242, 235, 0.55); }
  .draft-card .draft-delete {
    opacity: 0; transition: opacity .15s;
    background: transparent; border: none; cursor: pointer;
    color: #94a3b8; padding: 2px 6px; font-size: 14px; line-height: 1;
    border-radius: 3px;
  }
  .draft-card:hover .draft-delete { opacity: 1; }
  .draft-card .draft-delete:hover { color: #b91c1c; background: rgba(185, 28, 28, 0.08); }
  .draft-card.active .draft-delete { color: rgba(252, 165, 165, 0.7); opacity: 1; }
  .draft-card.active .draft-delete:hover { color: #fca5a5; background: rgba(252, 165, 165, 0.12); }

  /* Mobile drawer toggle */
  .drafts-mobile-toggle {
    display: none;
    background: #fff; color: var(--c-bg-deep); padding: 10px 14px;
    border-radius: 4px; border: 1px solid var(--c-line-soft);
    font-size: 13px; font-weight: 600; margin-bottom: 12px; width: 100%;
    text-align: left; box-shadow: var(--shadow-card);
  }
  @media (max-width: 1023px) {
    .drafts-sidebar { position: static; max-height: none; margin-bottom: 16px; }
    .drafts-sidebar.collapsed .drafts-sidebar-body { display: none; }
    .drafts-mobile-toggle { display: block; }
  }

  @media print { .no-print { display: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">

const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   PROVINCE LIST
   ============================================================ */
const PROVINCES = ["AB","BC","MB","NB","NL","NS","NT","NU","ON","PE","QC","SK","YT"];

/* ============================================================
   STORAGE — multi-draft persistence
   ============================================================ */
const AUTH_KEY = "triton_kyc_auth_v1";
const AUTH_CUSTOM_PASSWORD_HASH_KEY = "triton_kyc_custom_password_hash_v1";
const AUTH_PASSWORD_HASH = "b4d892dcdd1c8a38a97f6cfcac5bf20075d10947cd9cde9d41e18d2bb2f216d9";
const STORAGE_KEY_LEGACY = "triton_compliance_draft_v1";   // single object (kept for migration)
const STORAGE_KEY        = "triton_compliance_drafts_v2";  // array of drafts
const DEFAULT_ADVISOR_NAME = "Jie Yuan";
const REASON_WHY_ACCOUNT_OPTIONS = [
  { value: "RRSP", label: "RRSP" },
  { value: "FHSA", label: "FHSA" },
  { value: "TFSA", label: "TFSA" },
  { value: "Non-Registered", label: "Non-Registered" },
  { value: "Spousal RRSP", label: "Spousal RRSP" },
];
const todayISO = () => {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${mm}-${dd}`;
};

const loadDraftsList = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed.map(d => ({ ...d, formData: normalizeFormData(d.formData) }));
    }
    // One-time migration from v1 single-draft schema
    const legacy = localStorage.getItem(STORAGE_KEY_LEGACY);
    if (legacy) {
      const oldFormData = JSON.parse(legacy);
      return [makeDraft(oldFormData)];
    }
  } catch {}
  return [];
};
const saveDraftsList = (drafts) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(drafts)); return true; } catch { return false; }
};

const makeId = () => "d_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
const makeDraft = (formData) => ({
  id: makeId(),
  currentStep: 0,
  formData: normalizeFormData(formData ? deepClone(formData) : deepClone(initialFormDataRef.current)),
  updatedAt: Date.now(),
  createdAt: Date.now(),
});
const deepClone = (o) => JSON.parse(JSON.stringify(o));

const makeRowId = () => "r_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
const ensureRows = (rows, factory) => Array.isArray(rows) && rows.length ? rows : [factory()];
const getPath = (obj, path) => path.split(".").reduce((acc, key) => acc?.[key], obj);
const setPathMutable = (obj, path, value) => {
  const keys = path.split(".");
  let cur = obj;
  keys.forEach((key, idx) => {
    if (idx === keys.length - 1) {
      cur[key] = value;
      return;
    }
    cur[key] = cur[key] || {};
    cur = cur[key];
  });
};
const setPathImmutable = (obj, path, value) => {
  const keys = path.split(".");
  const clone = Array.isArray(obj) ? [...obj] : { ...obj };
  let cur = clone;
  keys.forEach((key, idx) => {
    if (idx === keys.length - 1) {
      cur[key] = value;
      return;
    }
    const next = cur[key];
    cur[key] = Array.isArray(next) ? [...next] : { ...(next || {}) };
    cur = cur[key];
  });
  return clone;
};
const splitFullName = (name) => {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length <= 1) return { first: parts[0] || "", last: "" };
  return { first: parts.slice(0, -1).join(" "), last: parts[parts.length - 1] };
};
const fullClientName = (ad = {}) => (ad.client1Name || ad.clientName || "").trim();
const fullHouseholdName = (ad = {}) => [fullClientName(ad), ad.client2Name].filter(Boolean).join(" / ");
const hasText = (v) => String(v || "").trim().length > 0;
const DEFAULT_TODAY_DATE_PATHS = [
  "advisorDisclosure.client1Date",
  "advisorDisclosure.client2Date",
  "segregatedFundInvestment.leverageCompliance.clientDateAck",
  "segregatedFundInvestment.leverageCompliance.jointDateAck",
  "segregatedFundInvestment.leverageCompliance.advisorDateAck",
  "segregatedFundInvestment.nonLeverageCompliance.clientDate",
  "segregatedFundInvestment.nonLeverageCompliance.advisorDate",
  "segregatedFundInvestment.insuranceQuestionnaire.manulife.dateCompleted",
  "segregatedFundInvestment.insuranceQuestionnaire.manulife.clientDate",
  "segregatedFundInvestment.insuranceQuestionnaire.manulife.advisorDate",
  "segregatedFundInvestment.insuranceQuestionnaire.iaFinancial.signedDate",
  "segregatedFundInvestment.insuranceQuestionnaire.canadaLife.date",
  "segregatedFundInvestment.insuranceQuestionnaire.equitableLife.clientDate",
  "segregatedFundInvestment.insuranceQuestionnaire.equitableLife.advisorDate",
  "lifeInsurance.needsAnalysis.policyOwnerDate",
  "lifeInsurance.needsAnalysis.advisorDate",
];
const applyDefaultTodayDates = (formData) => {
  const today = todayISO();
  DEFAULT_TODAY_DATE_PATHS.forEach(path => {

      (lc.netWorth.otherLabel || lc.netWorth.otherClient || lc.netWorth.otherJoint) && makeNetWorthOtherRow({ label: lc.netWorth.otherLabel, client: lc.netWorth.otherClient, joint: lc.netWorth.otherJoint }),

    li.fixedAssets = li.fixedAssets || {};

    li.fixedAssets.investmentProperties = ensureRows(li.fixedAssets.investmentProperties || legacyInvestRows, makeInvestmentPropertyRow);

/* Privacy-mask a name: keep first char, asterisk the rest (Chinese-aware) */
const maskName = (name) => {
  if (!name) return "";
  if (name.length <= 1) return name;
  // Chinese: keep first char + asterisks for the rest
  if (/[一-鿿]/.test(name)) return name[0] + "*".repeat(Math.max(1, name.length - 1));
  // English: keep first letter + 3 asterisks
  return name[0] + "***";
};

/* Format a timestamp into a compact label */
const formatDraftTimestamp = (ts) => {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  const hhmm = d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
  if (sameDay) return "今天 " + hhmm;
  if (isYesterday) return "昨天 " + hhmm;
  return (d.getMonth()+1) + "/" + d.getDate() + " " + hhmm;
};

const buildSteps = (data) => {
  const steps = [
    { key: "advisorDisclosure", label: "1. Advisor Disclosure" },
    { key: "businessType", label: "2. Business Type" },
  ];
  if (data.businessType === "Segregated Fund Investment") {
    steps.push({ key: "leverageSelection", label: "3. Leverage Loan" });
    if (data.segregatedFundInvestment.leverageLoan === "yes") {
      steps.push({ key: "leverageCompliance", label: "4. Leverage KYC" });
    } else if (data.segregatedFundInvestment.leverageLoan === "no") {
      steps.push({ key: "nonLeverageCompliance", label: "4. Sales Suitability" });
    }
    steps.push({ key: "insuranceSelection", label: "5. Insurance Company" });
    const ic = data.segregatedFundInvestment.selectedInsuranceCompany;
    if (ic === "Manulife") steps.push({ key: "manulife", label: "6. Manulife Questionnaire" });
    else if (ic === "iA Financial") steps.push({ key: "iaFinancial", label: "6. iA Investor Profile" });
    else if (ic === "Canada Life") steps.push({ key: "canadaLife", label: "6. Canada Life Questionnaire" });
    else if (ic === "Equitable Life") steps.push({ key: "equitableLife", label: "6. Equitable Questionnaire" });
    steps.push({ key: "review", label: "Review & PDF" });
  } else if (data.businessType === "Life Insurance") {
    steps.push({ key: "needsAnalysis", label: "3. Insurance Needs Analysis" });
    steps.push({ key: "review", label: "Review & PDF" });
  }
  return steps;
};

            <div className="font-semibold text-navy mb-2">Client 1</div>
            <Field label="Client name" required><TextInput value={d.client1Name} onChange={setClient1Name} /></Field>
            <SignatureField value={d.client1Signature} onChange={v => set("client1Signature", v)} label="Client signature *" />

/* ============================================================
   STEP: LEVERAGE COMPLIANCE (Citistar 4-page KYC)
   ============================================================ */
const LeverageComplianceForm = ({ data, update, markManualNamePath = () => {} }) => {
  const d = data.segregatedFundInvestment.leverageCompliance;
  const set = (k, v) => update("segregatedFundInvestment", {
    ...data.segregatedFundInvestment,
    leverageCompliance: { ...d, [k]: v }
  });
  const setNested = (parent, k, v) => set(parent, { ...d[parent], [k]: v });
  const incomeOtherItems = ensureRows(d.income.otherItems, makeIncomeOtherRow);
  const netWorthOtherItems = ensureRows(d.netWorth.otherItems, makeNetWorthOtherRow);
  const updateDebt = (i, k, v) => {
    const arr = d.debt.map((row, idx) => idx === i ? { ...row, [k]: v } : row);
    set("debt", arr);
  };
  const updateIncomeOther = (i, k, v) => {
    const rows = incomeOtherItems.map((row, idx) => idx === i ? { ...row, [k]: v } : row);
    set("income", { ...d.income, otherItems: rows });
  };
  const updateNetWorthOther = (i, k, v) => {
    const rows = netWorthOtherItems.map((row, idx) => idx === i ? { ...row, [k]: v } : row);
    set("netWorth", { ...d.netWorth, otherItems: rows });
  };
  const removeIncomeOther = (i) => set("income", { ...d.income, otherItems: incomeOtherItems.length > 1 ? incomeOtherItems.filter((_, idx) => idx !== i) : incomeOtherItems });
  const removeNetWorthOther = (i) => set("netWorth", { ...d.netWorth, otherItems: netWorthOtherItems.length > 1 ? netWorthOtherItems.filter((_, idx) => idx !== i) : netWorthOtherItems });
  const addIncomeOther = () => set("income", { ...d.income, otherItems: [...incomeOtherItems, makeIncomeOtherRow()] });
  const addNetWorthOther = () => set("netWorth", { ...d.netWorth, otherItems: [...netWorthOtherItems, makeNetWorthOtherRow()] });
  const addDebt = () => set("debt", [...d.debt, makeDebtRow()]);
  const removeDebt = (i) => set("debt", d.debt.length > 1 ? d.debt.filter((_, idx) => idx !== i) : d.debt);

  /* ---- auto-computed totals (kept fresh each render, not stored as separate state) ---- */
  const n = (v) => Number(v || 0);
  const incomeKeys = ["empClient","empJoint","investment","rental"];
  const totalAnnualIncome  = incomeKeys.reduce((s,k) => s + n(d.income[k]), 0);
  const totalAnnualIncomeWithOther = totalAnnualIncome + incomeOtherItems.reduce((s,r) => s + n(r.annual), 0);
  const totalMonthlyIncome = incomeKeys.reduce((s,k) => s + n(d.incomeMonthly[k]), 0);
  const totalMonthlyIncomeWithOther = totalMonthlyIncome + incomeOtherItems.reduce((s,r) => s + n(r.monthly), 0);
  const nwKeys = ["regClient","regJoint","nonRegClient","nonRegJoint","fixedClient","fixedJoint"];
  const totalNetWorth = nwKeys.reduce((s,k) => s + n(d.netWorth[k]), 0);
  const otherNetWorthClient = netWorthOtherItems.reduce((s,r)=> s + n(r.client), 0);
  const otherNetWorthJoint = netWorthOtherItems.reduce((s,r)=> s + n(r.joint), 0);
  const totalNetWorthWithOther = totalNetWorth + otherNetWorthClient + otherNetWorthJoint;
  const netWorthClient = ["regClient","nonRegClient","fixedClient"].reduce((s,k)=> s + n(d.netWorth[k]), 0) + otherNetWorthClient;
  const netWorthJoint  = ["regJoint","nonRegJoint","fixedJoint"].reduce((s,k)=> s + n(d.netWorth[k]), 0) + otherNetWorthJoint;
  const totalLiab     = d.debt.reduce((s,r) => s + n(r.balance), 0);
  const totalMonthlyDebt = d.debt.reduce((s,r) => s + n(r.monthly), 0);
  const liabPctNW = totalNetWorthWithOther > 0 ? (totalLiab / totalNetWorthWithOther) * 100 : 0;
  const debtPctInc = totalAnnualIncomeWithOther > 0 ? (totalMonthlyDebt * 12 / totalAnnualIncomeWithOther) * 100 : 0;

  /* Persist the derived totals back into the form data so the PDF reads them.
     We do this inside an effect so we don't re-render in a loop. */
  useEffect(() => {
    const patch = {
      income: { ...d.income, otherItems: incomeOtherItems, totalAnnual: String(totalAnnualIncomeWithOther || ""), totalMonthly: String(totalMonthlyIncomeWithOther || "") },
      netWorth: { ...d.netWorth, otherItems: netWorthOtherItems, total: String(totalNetWorthWithOther || "") },
      totalLiabilities: String(totalLiab || ""),
      totalMonthlyDebt: String(totalMonthlyDebt || ""),
      liabPctNetWorth:  totalNetWorthWithOther > 0 ? liabPctNW.toFixed(1) + "%" : "",
      debtPctIncome:    totalAnnualIncomeWithOther > 0 ? debtPctInc.toFixed(1) + "%" : "",
    };
    // Only write if something actually changed (avoids infinite re-render)
    const changed =
      d.income.totalAnnual !== patch.income.totalAnnual ||
      d.income.totalMonthly !== patch.income.totalMonthly ||
      d.netWorth.total !== patch.netWorth.total ||
      d.totalLiabilities !== patch.totalLiabilities ||
      d.totalMonthlyDebt !== patch.totalMonthlyDebt ||
      d.liabPctNetWorth !== patch.liabPctNetWorth ||
      d.debtPctIncome !== patch.debtPctIncome;
    if (changed) {
      update("segregatedFundInvestment", {
        ...data.segregatedFundInvestment,
        leverageCompliance: { ...d, ...patch },
      });
    }
  }, [totalAnnualIncomeWithOther, totalMonthlyIncomeWithOther, totalNetWorthWithOther, totalLiab, totalMonthlyDebt]);

  const ComputedCell = ({ value, suffix = "", warn = false }) => (
    <div style={{
      padding: "8px 12px", background: warn ? "#FEF3C7" : "#FAFAF6",
      border: "1px solid " + (warn ? "#FCD34D" : "#D8D3C4"),
      borderRadius: 4, fontWeight: 600, color: warn ? "#92400E" : "#0B1E3F",
      fontFamily: "var(--f-sans)"
    }}>
      {value}{suffix}
    </div>
  );
  const fmt$ = (v) => v ? "$" + Number(v).toLocaleString() : "$0";

  return (
    <div className="space-y-5">
      <header className="text-center pb-3 border-b border-gray-200">
        <div className="font-bold text-navy text-xl">CITISTAR FINANCIAL SERVICES LTD.</div>
        <div className="text-xs text-gray-600">1500-1200 West 73rd Avenue, Vancouver, BC, V6P 6G5</div>
        <div className="text-xs text-gray-600">Phone: 604-261-2123 · Fax: 604-261-2193</div>
        <h2 className="text-lg font-semibold text-navy mt-2">Segregated Funds Using Leverage Loan  -  KYC</h2>
      </header>

      <div className="section-header">CLIENT INFORMATION</div>
      <div className="grid md:grid-cols-2 gap-3">
        <Field label="Last Name of Client" required><TextInput value={d.clientLast} onChange={v => { markManualNamePath("segregatedFundInvestment.leverageCompliance.clientLast"); set("clientLast", v); }}/></Field>
        <Field label="First Name of Client" required><TextInput value={d.clientFirst} onChange={v => { markManualNamePath("segregatedFundInvestment.leverageCompliance.clientFirst"); set("clientFirst", v); }}/></Field>
        <Field label="Last Name of Joint Client"><TextInput value={d.jointLast} onChange={v => { markManualNamePath("segregatedFundInvestment.leverageCompliance.jointLast"); set("jointLast", v); }}/></Field>
        <Field label="First Name of Joint Client"><TextInput value={d.jointFirst} onChange={v => { markManualNamePath("segregatedFundInvestment.leverageCompliance.jointFirst"); set("jointFirst", v); }}/></Field>
      </div>
      <Field label="Leveraging">
        <RadioGroup vertical={false} name="leveragingType" value={d.leveragingType} onChange={v => set("leveragingType", v)}
          options={["NEW loan","Change to existing loan","Transfer-in from another firm"]} />
      </Field>

      <div className="section-header">KNOW-YOUR-CLIENT (KYC)</div>
      <div className="grid md:grid-cols-2 gap-3">
        <Field label="AGE - Client"><TextInput value={d.clientAge} onChange={v => set("clientAge", v)}/></Field>
        <Field label="AGE - Joint Applicant"><TextInput value={d.jointAge} onChange={v => set("jointAge", v)}/></Field>
      </div>
      <Field label="CLIENT KNOWLEDGE - Client">
        <RadioGroup vertical={false} name="ck" value={d.clientKnowledge} onChange={v => set("clientKnowledge", v)}
          options={["High/Sophisticated","Good/Knowledgeable","Average/Fair","Poor/None"]} />
      </Field>
      <Field label="CLIENT KNOWLEDGE - Joint Applicant">
        <RadioGroup vertical={false} name="jk" value={d.jointKnowledge} onChange={v => set("jointKnowledge", v)}
          options={["High/Sophisticated","Good/Knowledgeable","Average/Fair","Poor/None"]} />
      </Field>
      <Field label="INVESTMENT OBJECTIVES"><TextArea value={d.investmentObjectives} onChange={v => set("investmentObjectives", v)} rows={2}/></Field>

      <Field label="RISK TOLERANCE (%)  -  must sum to 100%">
        <div className="grid grid-cols-4 gap-2">
          <div><label className="text-xs text-gray-600">High</label><TextInput type="number" value={d.riskHigh} onChange={v => set("riskHigh", v)}/></div>
          <div><label className="text-xs text-gray-600">Medium</label><TextInput type="number" value={d.riskMedium} onChange={v => set("riskMedium", v)}/></div>
          <div><label className="text-xs text-gray-600">Low</label><TextInput type="number" value={d.riskLow} onChange={v => set("riskLow", v)}/></div>
          <div><label className="text-xs text-gray-600">Total</label><TextInput value={(Number(d.riskHigh||0)+Number(d.riskMedium||0)+Number(d.riskLow||0))+"%"} onChange={()=>{}} readOnly/></div>
        </div>
      </Field>
      <Field label="TIME HORIZON">
        <RadioGroup vertical={false} name="th" value={d.timeHorizon} onChange={v => set("timeHorizon", v)}
          options={["0-3 years","4-6 years","7-9 years","10 years +"]} />
      </Field>

      <div className="section-header-light">ANNUAL INCOME FROM ALL SOURCES</div>
      <table className="kyc-table">
        <thead><tr><th>Income Type</th><th>Annual Amount ($)</th><th>Monthly Income ($)</th></tr></thead>
        <tbody>
          {[
            ["empClient","Employment Client"],
            ["empJoint","Employment Joint Applicant"],
            ["investment","Investment (not from proposed investments)"],
            ["rental","Rental"],
          ].map(([k,label]) => (
            <tr key={k}>
              <td>{label}</td>
              <td><TextInput type="number" value={d.income[k]} onChange={v => setNested("income",k,v)}/></td>
              <td><TextInput type="number" value={d.incomeMonthly[k]} onChange={v => setNested("incomeMonthly",k,v)}/></td>
            </tr>
          ))}
          {incomeOtherItems.map((row, i) => (
            <tr key={row.id || i}>
              <td><TextInput value={row.label} onChange={v => updateIncomeOther(i, "label", v)} placeholder="Other (Specify)"/></td>
              <td><TextInput type="number" value={row.annual} onChange={v => updateIncomeOther(i, "annual", v)}/></td>
              <td>
                <div className="flex items-center gap-2">
                  <TextInput type="number" value={row.monthly} onChange={v => updateIncomeOther(i, "monthly", v)}/>
                  <button type="button" className="px-2 py-1 border rounded text-xs text-gray-600" onClick={() => removeIncomeOther(i)} disabled={incomeOtherItems.length <= 1}>Remove</button>
                </div>
              </td>
            </tr>
          ))}
          <tr style={{ background: "#FAFAF6" }}>
            <td className="font-semibold" style={{ color: "#0B1E3F" }}>Total Income <span className="text-xs font-normal text-gray-500">(auto)</span></td>
            <td><ComputedCell value={fmt$(totalAnnualIncomeWithOther)}/></td>
            <td><ComputedCell value={fmt$(totalMonthlyIncomeWithOther)}/></td>
          </tr>
        </tbody>
      </table>
      <button type="button" onClick={addIncomeOther} className="px-3 py-2 border border-[#C9A961] text-[#0B1E3F] rounded text-sm font-medium">+ Add Other Income</button>

      <div className="section-header-light">TOTAL NET WORTH ($)</div>
      <div className="text-xs text-gray-600 italic">New loan + Existing debts should not exceed 30%</div>
      <table className="kyc-table">
        <thead><tr><th>Asset Type</th><th>Client ($)</th><th>Joint Applicant ($)</th></tr></thead>
        <tbody>
          <tr><td>Registered Investments (less loans against securities)</td>
            <td><TextInput type="number" value={d.netWorth.regClient} onChange={v=>setNested("netWorth","regClient",v)}/></td>
            <td><TextInput type="number" value={d.netWorth.regJoint} onChange={v=>setNested("netWorth","regJoint",v)}/></td></tr>
          <tr><td>Non-Registered Investments (cash and securities less loans)</td>
            <td><TextInput type="number" value={d.netWorth.nonRegClient} onChange={v=>setNested("netWorth","nonRegClient",v)}/></td>
            <td><TextInput type="number" value={d.netWorth.nonRegJoint} onChange={v=>setNested("netWorth","nonRegJoint",v)}/></td></tr>
          <tr><td>Fixed Assets</td>
            <td><TextInput type="number" value={d.netWorth.fixedClient} onChange={v=>setNested("netWorth","fixedClient",v)}/></td>
            <td><TextInput type="number" value={d.netWorth.fixedJoint} onChange={v=>setNested("netWorth","fixedJoint",v)}/></td></tr>
          {netWorthOtherItems.map((row, i) => (
            <tr key={row.id || i}>
              <td><TextInput value={row.label} onChange={v=>updateNetWorthOther(i, "label", v)} placeholder="Other (Specify)"/></td>
              <td><TextInput type="number" value={row.client} onChange={v=>updateNetWorthOther(i, "client", v)}/></td>
              <td>
                <div className="flex items-center gap-2">
                  <TextInput type="number" value={row.joint} onChange={v=>updateNetWorthOther(i, "joint", v)}/>
                  <button type="button" className="px-2 py-1 border rounded text-xs text-gray-600" onClick={() => removeNetWorthOther(i)} disabled={netWorthOtherItems.length <= 1}>Remove</button>
                </div>
              </td>
            </tr>
          ))}
          <tr style={{ background: "#FAFAF6" }}>
            <td className="font-semibold" style={{ color: "#0B1E3F" }}>Subtotals <span className="text-xs font-normal text-gray-500">(auto)</span></td>
            <td><ComputedCell value={fmt$(netWorthClient)}/></td>
            <td><ComputedCell value={fmt$(netWorthJoint)}/></td>
          </tr>
          <tr style={{ background: "#FAFAF6" }}>
            <td className="font-semibold" style={{ color: "#0B1E3F" }}>Total Net Worth <span className="text-xs font-normal text-gray-500">(auto)</span></td>
            <td colSpan="2"><ComputedCell value={fmt$(totalNetWorthWithOther)}/></td>
          </tr>
        </tbody>
      </table>
      <button type="button" onClick={addNetWorthOther} className="px-3 py-2 border border-[#C9A961] text-[#0B1E3F] rounded text-sm font-medium">+ Add Other Net Worth</button>

      <div className="section-header-light">TOTAL DEBT PAYMENTS (New loan + existing loans)</div>
      <div className="text-xs text-gray-600">Does the client and/or joint applicant have any existing debt? If yes, please indicate in addition to any new loan information.</div>
      <table className="kyc-table">
        <thead><tr><th>Debt Type</th><th>Lender</th><th>Balance Outstanding ($)</th><th>Monthly Payments ($)</th><th></th></tr></thead>
        <tbody>
          {d.debt.map((row, i) => (
            <tr key={i}>
              <td><TextInput value={row.type} onChange={v => updateDebt(i,"type",v)}/></td>
              <td><TextInput value={row.lender} onChange={v => updateDebt(i,"lender",v)}/></td>
              <td><TextInput type="number" value={row.balance} onChange={v => updateDebt(i,"balance",v)}/></td>
              <td><TextInput type="number" value={row.monthly} onChange={v => updateDebt(i,"monthly",v)}/></td>
              <td><button type="button" className="px-2 py-1 border rounded text-xs text-gray-600" onClick={() => removeDebt(i)} disabled={d.debt.length <= 1}>Remove</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <button type="button" onClick={addDebt} className="px-3 py-2 border border-[#C9A961] text-[#0B1E3F] rounded text-sm font-medium">+ Add Debt</button>
      <div className="grid md:grid-cols-2 gap-3">
        <Field label="Total Liabilities ($) — auto"><ComputedCell value={fmt$(totalLiab)}/></Field>
        <Field label="% of Total Net Worth (≤30%)"><ComputedCell value={totalNetWorthWithOther > 0 ? liabPctNW.toFixed(1) + "%" : "—"} warn={liabPctNW > 30}/></Field>
        <Field label="Total Monthly Debt Payments ($) — auto"><ComputedCell value={fmt$(totalMonthlyDebt)}/></Field>
        <Field label="% of Total Annual Income (≤35%)"><ComputedCell value={totalAnnualIncomeWithOther > 0 ? debtPctInc.toFixed(1) + "%" : "—"} warn={debtPctInc > 35}/></Field>
      </div>

      <div className="bg-yellow-50 border border-yellow-200 rounded p-3 text-sm">
        <div className="font-semibold text-navy mb-1">General Client Criteria</div>

const LifeInsuranceNeedsAnalysisForm = ({ data, update, markManualNamePath = () => {} }) => {
  const d = data.lifeInsurance.needsAnalysis;
  const set = (k,v) => update("lifeInsurance", { needsAnalysis: { ...d, [k]: v } });
  const setObj = (parent, k, v) => set(parent, { ...d[parent], [k]: v });
  const investmentProperties = ensureRows(d.fixedAssets.investmentProperties, makeInvestmentPropertyRow);
  const otherLiquidItems = ensureRows(d.liquidAssets.otherItems, makeOtherLiquidRow);
  const updateInvestmentProperty = (i, k, v) => {
    const rows = investmentProperties.map((row, idx) => idx === i ? { ...row, [k]: v } : row);
    setObj("fixedAssets", "investmentProperties", rows);
  };
  const updateOtherLiquid = (i, k, v) => {
    const rows = otherLiquidItems.map((row, idx) => idx === i ? { ...row, [k]: v } : row);
    setObj("liquidAssets", "otherItems", rows);
  };
  const addInvestmentProperty = () => setObj("fixedAssets", "investmentProperties", [...investmentProperties, makeInvestmentPropertyRow()]);
  const addOtherLiquid = () => setObj("liquidAssets", "otherItems", [...otherLiquidItems, makeOtherLiquidRow()]);
  const removeInvestmentProperty = (i) => setObj("fixedAssets", "investmentProperties", investmentProperties.length > 1 ? investmentProperties.filter((_, idx) => idx !== i) : investmentProperties);
  const removeOtherLiquid = (i) => setObj("liquidAssets", "otherItems", otherLiquidItems.length > 1 ? otherLiquidItems.filter((_, idx) => idx !== i) : otherLiquidItems);

  const num = (x) => Number(x || 0);
  const investmentPropertiesMV = investmentProperties.reduce((s,r) => s + num(r.marketValue), 0);
  const investmentPropertiesLoan = investmentProperties.reduce((s,r) => s + num(r.loan), 0);
  const fixedTotalMV = num(d.fixedAssets.principalMV) + investmentPropertiesMV;
  const fixedTotalLoan = num(d.fixedAssets.principalLoan) + investmentPropertiesLoan;
  const fixedTotalNet = fixedTotalMV - fixedTotalLoan;
  const principalNet = num(d.fixedAssets.principalMV) - num(d.fixedAssets.principalLoan);

  const liqRegNet = num(d.liquidAssets.regMV) - num(d.liquidAssets.regLoan);
  const liqNonRegNet = num(d.liquidAssets.nonRegMV) - num(d.liquidAssets.nonRegLoan);
  const liqBankNet = num(d.liquidAssets.bankMV) - num(d.liquidAssets.bankLoan);
  const otherLiquidMV = otherLiquidItems.reduce((s,r) => s + num(r.marketValue), 0);
  const otherLiquidLoan = otherLiquidItems.reduce((s,r) => s + num(r.loan), 0);
  const liqTotalMV = num(d.liquidAssets.regMV) + num(d.liquidAssets.nonRegMV) + num(d.liquidAssets.bankMV) + otherLiquidMV;
  const liqTotalLoan = num(d.liquidAssets.regLoan) + num(d.liquidAssets.nonRegLoan) + num(d.liquidAssets.bankLoan) + otherLiquidLoan;
  const liqTotalNet = liqTotalMV - liqTotalLoan;

  const businessNet = num(d.businessAssets.fmv);
  const foreignWith = num(d.foreignAssets.withProofValue);
  const foreignWithout = num(d.foreignAssets.withoutProofValue);
  const totalNetWorth = fixedTotalNet + liqTotalNet + businessNet + foreignWith + foreignWithout;

  const earned = num(d.earnedIncome);
  const ciIncome = earned * num(d.ciIncomeMultiple);
  const lifeIncome = earned * num(d.lifeIncomeMultiple);
  const ciMortgage = num(d.ciMortgage);
  const lifeMortgage = num(d.lifeMortgage);
  const maxCI = ciIncome + ciMortgage;
  const maxLife = lifeIncome + lifeMortgage;

  return (
    <div className="space-y-5">
      <h2 className="text-2xl font-bold text-navy text-center">Insurance Needs Analysis</h2>

      <table className="kyc-table">
        <tbody>
          <tr>
            <th>Client's Name<span className="text-red-700 font-semibold"> *</span></th><td><TextInput value={d.clientName} onChange={v=>{ markManualNamePath("lifeInsurance.needsAnalysis.clientName"); set("clientName",v); }}/></td>
            <th>Occupation</th><td><TextInput value={d.occupation} onChange={v=>set("occupation",v)}/></td>
          </tr>
          <tr>
            <th>Age</th><td><TextInput type="number" value={d.age} onChange={v=>set("age",v)}/></td>
            <th>Industry</th><td><TextInput value={d.industry} onChange={v=>set("industry",v)}/></td>
          </tr>
          <tr><td colSpan="3">Earned income, including salary, commission &amp; bonus (if 100% biz owner, add bf tax profit)</td><td><TextInput type="number" value={d.earnedIncome} onChange={v=>set("earnedIncome",v)}/></td></tr>
          <tr><td colSpan="3">Unearned income, including Pension, investment, rental income</td><td><TextInput type="number" value={d.unearnedIncome} onChange={v=>set("unearnedIncome",v)}/></td></tr>
          <tr><td colSpan="3">Spouse income</td><td><TextInput type="number" value={d.spouseIncome} onChange={v=>set("spouseIncome",v)}/></td></tr>
        </tbody>
      </table>

      <div className="section-header-light">Canadian Fixed Assets</div>
      <table className="kyc-table">
        <thead><tr><th>Asset</th><th>Market Value</th><th>Mortgage &amp; LOC</th><th>Net Worth</th><th></th></tr></thead>
        <tbody>
          <tr><td>Principal Residence</td>
            <td><TextInput type="number" value={d.fixedAssets.principalMV} onChange={v=>setObj("fixedAssets","principalMV",v)}/></td>
            <td><TextInput type="number" value={d.fixedAssets.principalLoan} onChange={v=>setObj("fixedAssets","principalLoan",v)}/></td>
            <td className="text-right font-semibold">{principalNet.toLocaleString()}</td><td></td></tr>
          {investmentProperties.map((row, i) => (
            <tr key={row.id || i}>
              <td><TextInput value={row.name} onChange={v=>updateInvestmentProperty(i, "name", v)} placeholder="Investment Property"/></td>
              <td><TextInput type="number" value={row.marketValue} onChange={v=>updateInvestmentProperty(i, "marketValue", v)}/></td>
              <td><TextInput type="number" value={row.loan} onChange={v=>updateInvestmentProperty(i, "loan", v)}/></td>
              <td className="text-right font-semibold">{(num(row.marketValue) - num(row.loan)).toLocaleString()}</td>
              <td><button type="button" className="px-2 py-1 border rounded text-xs text-gray-600" onClick={() => removeInvestmentProperty(i)} disabled={investmentProperties.length <= 1}>Remove</button></td>
            </tr>

          <tr><th>Total Fixed Assets</th><th className="text-right">{fixedTotalMV.toLocaleString()}</th><th className="text-right">{fixedTotalLoan.toLocaleString()}</th><th className="text-right">{fixedTotalNet.toLocaleString()}</th><th></th></tr>

            <td><TextInput type="number" value={d.liquidAssets.regMV} onChange={v=>setObj("liquidAssets","regMV",v)}/></td>

          <tr><td>Bank savings</td>
            <td><TextInput type="number" value={d.liquidAssets.bankMV} onChange={v=>setObj("liquidAssets","bankMV",v)}/></td>

          {otherLiquidItems.map((row, i) => (

              <td><TextInput type="number" value={row.marketValue} onChange={v=>updateOtherLiquid(i, "marketValue", v)}/></td>
              <td><TextInput type="number" value={row.loan} onChange={v=>updateOtherLiquid(i, "loan", v)}/></td>

            </tr>

          <tr><th>Total Liquid Assets</th><th className="text-right">{liqTotalMV.toLocaleString()}</th><th className="text-right">{liqTotalLoan.toLocaleString()}</th><th className="text-right">{liqTotalNet.toLocaleString()}</th><th></th></tr>

const coverProductType = (data) => {
  if (data.businessType === "Segregated Fund Investment") {
    const sf = data.segregatedFundInvestment || {};
    const company = companyDisplayName(sf.selectedInsuranceCompany);
    const account = reasonWhyLabel(sf.reasonWhy?.accountType);
    return `${company} Segregated Fund Contract${account ? " - " + account : ""}`;
  }
  if (data.businessType === "Life Insurance") {
    const li = data.lifeInsurance?.needsAnalysis || {};
    const hasCI = Number(li.newCoverageCI || 0) > 0;
    const hasLife = Number(li.newCoverageLife || 0) > 0;
    if (hasCI && hasLife) return "Life Insurance / Critical Illness Insurance";
    if (hasCI) return "Critical Illness Insurance";
    if (hasLife) return "Life Insurance";

ause it combines the tax advantages of the RRSP with capital guarantees and insurance-contract features.\n\n${commonClose}`,

    TFSA: `REASON WHY LETTER\n${ctx.company} Segregated Fund Contract - TFSA\n${ctx.date}\n\nDear ${greetingName},\n\nRecommendation\nBased on our recent meeting and the financial needs analysis we completed together, I am recommending that you make a lump-sum deposit of ${ctx.investmentAmount} into a Tax-Free Savings Account (TFSA) under a segregated fund contract with ${ctx.company}.\n\nYour Stated Needs & Objectives\nDuring our recent meeting, we reviewed your overall financial situation, long-term goals, and your comfort level with investment risk. You confirmed that you have sufficient TFSA contribution room available and a lump sum of cash savings ready to deploy. Your primary objectives are to invest your savings in a vehicle that grows tax-free, maintain flexibility to withdraw funds tax-free, protect your principal through downside guarantees, and ensure an efficient investment structure.\n\nHow This Recommendation Meets Your Needs\nA TFSA provides tax-free growth on investment returns and tax-free withdrawals at any time, for any purpose. The ${ctx.company} segregated fund contract enhances this with a ${guaranteeLine} on your net deposits, providing meaningful downside protection through market cycles.\n\nBecause this is a lump-sum deposit, the full ${ctx.investmentAmount} is invested immediately and begins participating in the market from the contract issue date. Based on your investment horizon of at least 10 years and the risk tolerance documented in your Know-Your-Client profile, we selected a diversified portfolio of segregated funds. You retain the flexibility to switch between available funds in the contract as your circumstances change.\n\nTFSA Contribution Room - Important\nI have confirmed with you that your available TFSA contribution room is sufficient for this ${ctx.investmentAmount} deposit. Over-contributing to a TFSA results in a CRA penalty tax of 1% per month on the excess until withdrawn. I recommend you verify your current room directly through your CRA \"My Account\" portal before any future deposit, as employer-issued T4 amounts and prior-year withdrawals may take time to update.\n\n${commonDisclosure}\n\nAlternatives Considered\nWe discussed a high-interest savings account, a GIC, and a non-registered investment account. The segregated fund TFSA was recommended because it combines tax-free growth and withdrawals with capital guarantees and insurance-contract features.\n\n${commonClose}`,
    "Non-Registered": `REASON WHY LETTER\n${ctx.company} Segregated Fund Contract - Non-Registered\n${ctx.date}\n\nDear ${greetingName},\n\nRecommendation\nBased on our recent meeting and the financial needs analysis we completed together, I am recommending that you establish a Non-Registered account under a segregated fund contract with ${ctx.company}. The contribution amount is ${ctx.investmentAmount}.\n\nYour Stated Needs & Objectives\nDuring our recent meeting, we reviewed your overall financial situation, long-term goals, and your comfort level with investment risk. Your primary objectives are to continue building investment wealth beyond registered accounts, protect those assets through an insurance-contract structure where applicable, and manage the tax impact of investment growth.\n\nHow This Recommendation Meets Your Needs\nThe ${ctx.company} Non-Registered segregated fund contract addresses these objectives in ways that traditional non-registered accounts may not. The contract provides a ${guaranteeLine} on your net deposits, subject to the terms of the Information Folder and Contract. Investment growth may include capital gains, interest, dividends, or other allocations, and tax treatment will depend on the nature of the income allocated and your personal tax situation.\n\nBased on your investment horizon and risk tolerance, we selected a diversified portfolio of segregated funds aligned with your long-term wealth-building objectives, with the flexibility to switch between available funds as your needs evolve.\n\n${commonDisclosure}\n\nAlternatives Considered\nWe discussed traditional non-registered mutual fund accounts, GICs, and direct ownership of securities. The segregated fund contract was recommended because it provides insurance-contract features in addition to the maturity and death benefit guarantees that ordinary investment accounts do not provide.\n\n${commonClose}`,
    "Spousal RRSP": `REASON WHY LETTER\n${ctx.company} Segregated Fund Contract - Spousal RRSP\n${ctx.date}\n\nDear ${greetingName},\n\nRecommendation\nBased on our recent meeting and the financial needs analysis we completed together, I am recommending that ${ctx.householdName || ctx.clientName} establish a Spousal Registered Retirement Savings Plan (Spousal RRSP) under a segregated fund contract with ${ctx.company}. The contribution amount is ${ctx.investmentAmount}.\n\nYour Stated Needs & Objectives\nDuring our recent meeting, we reviewed your household's overall financial situation, long-term retirement goals, and risk tolerance as a couple. Your primary objectives are to build retirement savings, support future retirement income planning between spouses, protect the invested capital, and maintain an insurance-contract structure.\n\nHow This Recommendation Meets Your Needs\nA Spousal RRSP allows a household to direct retirement savings toward a spouse and may support future retirement income planning. The segregated fund contract provides a ${guaranteeLine} on net deposits, subject to the terms of the Information Folder and Contract.\n\nThree-Year Attribution Rule\nI have explained that under the Income Tax Act, if funds are withdrawn from a Spousal RRSP in the same calendar year a contribution is made or in either of the two following calendar years, the withdrawn amount, up to the amount of contributions made in that period, may be attributed back to the contributor and taxed in the contributor's hands. We have reviewed the intended contribution and withdrawal timing with this rule in mind.\n\n${commonDisclosure}\n\nAlternatives Considered\nWe discussed each spouse contributing separately to individual RRSPs and using future retirement income planning strategies. The Spousal RRSP was recommended because it can provide additional household retirement planning flexibility while adding segregated fund contract features.\n\n${commonClose}`,
  };
  return stripTemplatePlaceholders(templates[ctx.accountType] || "");
};

/* ============================================================
   INLINE SIGNATURE / DATE / INITIAL PLACEHOLDER
   <SigPlaceholder kind="signature|date|initials" label="..."/>
   Renders a clean signature line + small caps label. Used in the
   printable PDF so each form has clearly marked spots for the
   client / advisor to sign with pen or stamp.
   ============================================================ */
const SigPlaceholder = ({ kind = "signature", label, width }) => {
  const defaultLabel = label || (
    kind === "date" ? "Date" :
    kind === "initials" ? "Initials" :
    "Signature"
  );
  const w = width || (kind === "initials" ? 70 : kind === "date" ? 130 : 210);
  return (
    <div style={{ display: "inline-block", verticalAlign: "bottom", marginRight: 14, marginBottom: 4 }}>
      <div style={{ width: w, height: kind === "date" ? 24 : 30, border: "1px dashed " + GOLD, background: "#fff4cc", borderRadius: 4 }}/>
      <div style={{ fontSize: PDF_TYPE.footer, color: TEXT_SOFT, letterSpacing: 0.6, textTransform: "uppercase", fontWeight: 650, marginTop: 3 }}>
        {defaultLabel}
      </div>
    </div>
  );
};

/* Combined block: signature line + date for one signer */
const SigBlock = ({ name, role }) => (

const REASON_WHY_TITLE_LINES = new Set([
  "REASON WHY LETTER",
  "Recommendation",
  "Your Stated Needs & Objectives",
  "How This Recommendation Meets Your Needs",
  "TFSA Contribution Room - Important",
  "Three-Year Attribution Rule",
  "Disclosures",
  "Risk Disclosures",
  "Alternatives Considered",
  "Important Notice",
  "Client Acknowledgement",
]);
const CLIENT_ACK_TITLE = "Client Acknowledgement";
const CLIENT_ACK_TEXT = "I acknowledge that I have reviewed this Reason Why Letter and understand the rationale for the recommendation described above.";
const stripReasonWhyLeadingTitles = (blocks, ctx) => {
  const contractTitle = `${ctx.company} Segregated Fund Contract - ${ctx.accountLabel}`.toLowerCase();
  return blocks.map((block, idx) => {
    if (idx > 2) return block;
    const lines = String(block.text || "").split(/\n/).map(line => line.trim()).filter(Boolean);
    const kept = lines.filter(line => {
      const text = line.toLowerCase();
      if (text === "reason why letter") return false;
      if (text === contractTitle) return false;
      if (text.includes("segregated fund contract") && text.includes(String(ctx.accountLabel || "").toLowerCase())) return false;
      return true;
    });
    return { ...block, text: kept.join("\n") };
  }).filter(block => hasText(block.text));
};
const reasonWhyBodyBlocks = (body) => {
  const blocks = [];
  String(body || "").split(/\n/).forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) return;
    if (REASON_WHY_TITLE_LINES.has(line)) {
      blocks.push({ type: "heading", text: line });
    } else {
      const previous = blocks[blocks.length - 1];
      if (previous?.type === "paragraph") previous.text += "\n" + line;
      else blocks.push({ type: "paragraph", text: line });
    }
  });
  return blocks;
};
const hasClientAcknowledgement = (blocks) => blocks.some(block => /client\s+acknowledg?ement/i.test(block.text || ""));
const withClientAcknowledgement = (blocks) => hasClientAcknowledgement(blocks)
  ? blocks
  : [...blocks, { type: "heading", text: CLIENT_ACK_TITLE }, { type: "paragraph", text: CLIENT_ACK_TEXT }];
const looksLikeLetterHeading = (line) => {
  const text = String(line || "").trim();
  if (!text || text.length > 72) return false;
  if (REASON_WHY_TITLE_LINES.has(text)) return true;
  if (/^[A-Z][A-Za-z0-9 &/'().,-]{2,}$/.test(text) && !/[.!?]$/.test(text) && text.split(/\s+/).length <= 8) return true;
  return false;
};
const letterBodyBlocks = (body) => String(body || "")
  .replace(/\r\n/g, "\n")
  .split(/\n{2,}/)
  .map(part => part.split(/\n/).map(line => line.trim()).filter(Boolean).join("\n"))
  .filter(Boolean)
  .map(text => ({ type: looksLikeLetterHeading(text) ? "heading" : "paragraph", text }));
const chunkReasonWhyBlocks = (blocks, maxChars = 2600) => {
  const pages = [];
  let page = [];
  let count = 0;
  blocks.forEach(block => {
    const weight = block.text.length + (block.type === "heading" ? 90 : 40);
    if (page.length && count + weight > maxChars) {
      pages.push(page);
      page = [];
      count = 0;
    }
    page.push(block);
    count += weight;
  });
  if (page.length) pages.push(page);
  return pages;
};

const ReasonWhyPdf = ({ data }) => {
  const ctx = reasonWhyContext(data);
  const body = makeReasonWhy(data.segregatedFundInvestment?.reasonWhy).body;
  const blocks = stripReasonWhyLeadingTitles(reasonWhyBodyBlocks(body), ctx);
  if (!blocks.length) return null;
  const pages = chunkReasonWhyBlocks(blocks, 3200);
  const contractTitle = reasonWhyContractSubtitle(ctx);
  const renderBlock = (block, idx) => block.type === "heading" ? (
    <div key={idx} style={{ color: TEXT_COLOR, fontSize: 11.05, fontWeight: 700, lineHeight: 1.35, marginTop: idx === 0 ? 0 : 10, marginBottom: 5 }}>{block.text}</div>
  ) : (
    <div key={idx} style={{ fontSize: 10.45, lineHeight: 1.54, color: TEXT_COLOR, marginBottom: 9, whiteSpace: "pre-wrap", overflowWrap: "anywhere" }}>{block.text}</div>
  );
  return (
    <>
      {pages.map((pageBlocks, pageIdx) => (
        <ReasonWhyPage key={pageIdx}>
          <TritonLetterheadHeader title="Reason Why Letter" subtitle={contractTitle} centerTitle />
          <div style={{ marginTop: 10 }}>
            {pageBlocks.map(renderBlock)}
            {pageIdx === pages.length - 1 && (
              <div style={{ marginTop: 15, padding: 10, background: "#FAFAF6", borderLeft: "3px solid " + GOLD }}>
                <div style={{ fontSize: PDF_TYPE.label, color: NAVY, letterSpacing: 0.65, textTransform: "uppercase", fontWeight: 650, marginBottom: 6 }}>{ctx.clientName}</div>

                <SigPlaceholder kind="date" signer="signer2" label="Date" width={130}/>

        </ReasonWhyPage>
      ))}
    </>
  );
};

/* --------- Life Insurance Needs Analysis --------- */
const LifeInsurancePdf = ({ li }) => {
  const num = (x) => Number(x || 0);
  const investmentProperties = ensureRows(li.fixedAssets.investmentProperties, makeInvestmentPropertyRow);
  const otherLiquidItems = ensureRows(li.liquidAssets.otherItems, makeOtherLiquidRow);
  const investmentPropertiesMV = investmentProperties.reduce((s,r) => s + num(r.marketValue), 0);
  const investmentPropertiesLoan = investmentProperties.reduce((s,r) => s + num(r.loan), 0);
  const otherLiquidMV = otherLiquidItems.reduce((s,r) => s + num(r.marketValue), 0);
  const otherLiquidLoan = otherLiquidItems.reduce((s,r) => s + num(r.loan), 0);
  const fixedTotalNet = (num(li.fixedAssets.principalMV)+investmentPropertiesMV) - (num(li.fixedAssets.principalLoan)+investmentPropertiesLoan);
  const liqTotalNet = (num(li.liquidAssets.regMV)+num(li.liquidAssets.nonRegMV)+num(li.liquidAssets.bankMV)+otherLiquidMV) - (num(li.liquidAssets.regLoan)+num(li.liquidAssets.nonRegLoan)+num(li.liquidAssets.bankLoan)+otherLiquidLoan);
  const totalNetWorth = fixedTotalNet + liqTotalNet + num(li.businessAssets.fmv) + num(li.foreignAssets.withProofValue) + num(li.foreignAssets.withoutProofValue);
  const earned = num(li.earnedIncome);
  const maxCI = earned * num(li.ciIncomeMultiple) + num(li.ciMortgage);

          <PdfTable headers={["Asset","Market Value","Mortgage & LOC","Net Worth"]} rows={[
            ["Principal Residence", fmtMoney(li.fixedAssets.principalMV), fmtMoney(li.fixedAssets.principalLoan), fmtMoney(num(li.fixedAssets.principalMV)-num(li.fixedAssets.principalLoan))],
            ...investmentProperties.map(row => [row.name || "Investment Property", fmtMoney(row.marketValue), fmtMoney(row.loan), fmtMoney(num(row.marketValue)-num(row.loan))]),

        </PdfSection>

            ["Non-registered investment", fmtMoney(li.liquidAssets.nonRegMV), fmtMoney(li.liquidAssets.nonRegLoan), fmtMoney(num(li.liquidAssets.nonRegMV)-num(li.liquidAssets.nonRegLoan))],
            ["Bank savings", fmtMoney(li.liquidAssets.bankMV), fmtMoney(li.liquidAssets.bankLoan), fmtMoney(num(li.liquidAssets.bankMV)-num(li.liquidAssets.bankLoan))],

const PDF_MM = { w: 215.9, h: 279.4 };
const PDF_VEC = {
  margin: 15,
  reasonMargin: 16,
  footerY: 270,
  navy: NAVY,
  gold: GOLD,
  cream: CREAM,
  creamDeep: CREAM_DEEP,
  text: TEXT_COLOR,
  soft: TEXT_SOFT,
  line: "#D8DCE5",
  tableHeader: "#F3F1EA",
  panel: "#FBFAF7",

const cleanPdfText = (value) => {
  if (value === null || value === undefined || value === false) return "";
  if (Array.isArray(value)) return value.map(cleanPdfText).filter(Boolean).join(", ");
  if (typeof value === "object") return "";
  return String(value)
    .replace(/\u00a0/g, " ")
    .replace(/[✓✔]/g, "X")
    .replace(/[≤]/g, "<=")
    .replace(/[≥]/g, ">=")
    .replace(/[•·]/g, "-")
    .replace(/[–—]/g, "-")
    .replace(/[“”]/g, '"')
    .replace(/[‘’]/g, "'")
    .replace(/[^\x09\x0A\x0D\x20-\x7E]/g, "");
};
class PdfWriter {

    this.y = this.margin;
    this.contentW = PDF_MM.w - this.margin * 2;
    this.footerEnabled = true;

    this.setMargin(margin);

    if (!cover) {
      this.pdf.setFillColor("#FFFFFF");
      this.pdf.rect(0, 0, PDF_MM.w, PDF_MM.h, "F");
      this.pdf.setFillColor(PDF_VEC.gold);
      this.pdf.rect(0, 0, PDF_MM.w, 1.2, "F");

  footer() {

    this.pdf.setDrawColor(PDF_VEC.creamDeep);
    this.pdf.setLineWidth(0.2);
    this.pdf.line(this.margin, PDF_VEC.footerY - 4, PDF_MM.w - this.margin, PDF_VEC.footerY - 4);
    this.setFont(7.5, "normal", "#7A8292");
    this.pdf.text("Triton Wealth Management", this.margin, PDF_VEC.footerY);

  }
  finishPage() {

  }
  logoData() {

  fields(items, columns = 2) {

const reasonBlockHeight = (w, block) => {
  const size = block.type === "heading" ? 10.2 : 9.25;
  const lineH = block.type === "heading" ? 4.7 : 5.1;
  return w.textLines(block.text, w.contentW, size).length * lineH + (block.type === "heading" ? 4 : 5.8);
};
const drawReasonWhyVector = (w, data, fromAttachment = false) => {
  const ctx = reasonWhyContext(data);
  const rw = makeReasonWhy(data.segregatedFundInvestment?.reasonWhy);
  const rawBlocks = fromAttachment ? withClientAcknowledgement(stripReasonWhyLeadingTitles(letterBodyBlocks(rw.attachment.text), ctx)) : stripReasonWhyLeadingTitles(reasonWhyBodyBlocks(rw.body), ctx);
  if (!rawBlocks.length) return;
  const subtitle = reasonWhyContractSubtitle(ctx);
  w.addPage({ margin: PDF_VEC.reasonMargin });
  w.reasonHeader("Reason Why Letter", subtitle);
  for (let i = 0; i < rawBlocks.length; i++) {
    const block = rawBlocks[i];
    const next = rawBlocks[i + 1];
    let keepH = reasonBlockHeight(w, block);
    if (block.type === "heading" && next?.type === "paragraph") keepH += reasonBlockHeight(w, next);
    if (w.y + keepH > 258) {
      w.finishPage();
      w.addPage({ margin: PDF_VEC.reasonMargin });
      w.reasonHeader("Reason Why Letter", subtitle, true);
    }
    if (block.type === "heading") w.textBlock(block.text, { size: 10.2, lineH: 4.7, bold: true, gap: 2.5 });
    else w.textBlock(block.text, { size: 9.25, lineH: 5.1, gap: 3.2 });
  }
  if (w.y + 34 > 258) {
    w.finishPage();
    w.addPage({ margin: PDF_VEC.reasonMargin });
    w.reasonHeader("Reason Why Letter", subtitle, true);
  }
  if (!hasClientAcknowledgement(rawBlocks)) {
    w.textBlock("Client Acknowledgement", { size: 10, bold: true, gap: 2.5 });
    w.textBlock(CLIENT_ACK_TEXT, { size: 9.2, lineH: 5.0, gap: 3.2 });
  }
  w.signature(ctx.clientName, "Client");
  w.finishPage();
};
const buildVectorPdf = async (data) => {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p", "mm", "letter");
  const w = new PdfWriter(pdf, "helvetica");
  const sf = data.segregatedFundInvestment || {};
  const isSegFund = data.businessType === "Segregated Fund Investment";
  const isLifeIns = data.businessType === "Life Insurance";
  w.cover(data);
  drawAdvisorDisclosureVector(w, data.advisorDisclosure || {});
  if (isSegFund && sf.leverageLoan === "yes") drawLeverageVector(w, sf.leverageCompliance || {});
  if (isSegFund && sf.leverageLoan === "no") drawNonLeverageVector(w, sf.nonLeverageCompliance || {});
  if (isSegFund) drawInsuranceQuestionnaireVector(w, sf);
  if (isSegFund) {
    const rw = makeReasonWhy(sf.reasonWhy);
    if (reasonWhyHasAttachment(rw) && rw.attachment.kind === "docx" && hasText(rw.attachment.text)) drawReasonWhyVector(w, data, true);
    if (!reasonWhyHasAttachment(rw) && rw.accountType && hasText(rw.body)) drawReasonWhyVector(w, data, false);
  }
  if (isLifeIns) drawLifeInsuranceVector(w, data.lifeInsurance.needsAnalysis || {});

};

const SendToAdobeSignModal = ({ open, onClose, data, getPdfBlob }) => {
  const [backendUrl, setBackendUrl] = useState(() => {
    const savedUrl = localStorage.getItem(ADOBE_SIGN_BACKEND_KEY);
    if (savedUrl) return savedUrl;
    if (window.location.protocol === "http:" || window.location.protocol === "https:") return window.location.origin;
    return "http://localhost:3000";
  });
  const [advisorEmail, setAdvisorEmail] = useState("");
  const [advisorName, setAdvisorName] = useState("Jie Yuan");
  const [client1Email, setClient1Email] = useState("");
  const [client1Name, setClient1Name] = useState(data.advisorDisclosure.client1Name || "");
  const [client2Email, setClient2Email] = useState("");
  const [client2Name, setClient2Name] = useState(data.advisorDisclosure.client2Name || "");
  const [message, setMessage] = useState("Please review and sign  -  Triton Wealth Management.");
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [serverStatus, setServerStatus] = useState(null);   // { ok, hasClientId, hasClientSecret, hasRefreshToken }
  const [statusChecking, setStatusChecking] = useState(false);

  const checkServerStatus = async (url) => {
    setStatusChecking(true);
    setServerStatus(null);
    try {
      const res = await fetch(url.replace(/\/$/, "") + "/api/health", { method: "GET" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      setServerStatus(json);
    } catch (err) {
      setServerStatus({ ok: false, error: err.message });
    } finally {
      setStatusChecking(false);
    }
  };

  useEffect(() => {
    if (open) {
      setClient1Name(data.advisorDisclosure.client1Name || "");
      setClient2Name(data.advisorDisclosure.client2Name || "");
      setResult(null);
      setError("");
      checkServerStatus(backendUrl);
    }
  }, [open]);

  if (!open) return null;

  const includeSpouse = !!data.advisorDisclosure.spouseConsent || !!data.advisorDisclosure.client2Name;

  const handleSend = async () => {
    setError("");
    setResult(null);
    if (!advisorEmail || !client1Email) {
      setError("Advisor email and at least one client email are required.");
      return;
    }
    setBusy(true);
    try {
      localStorage.setItem(ADOBE_SIGN_BACKEND_KEY, backendUrl);
      const pdfBlob = await getPdfBlob();
      const pdfBase64 = await blobToBase64(pdfBlob);
      const clientName = (client1Name || data.advisorDisclosure.clientName || "Client").trim();
      const businessSlug = data.businessType === "Life Insurance" ? "Life Insurance" : "Segregated Fund";
      const signers = [
        { email: advisorEmail.trim(), name: advisorName.trim() || "Advisor" },
        { email: client1Email.trim(), name: client1Name.trim() || "Client 1" },
      ];
      if (includeSpouse && client2Email.trim()) {
        signers.push({ email: client2Email.trim(), name: client2Name.trim() || "Client 2" });
      }
      const dateStr = new Date().toISOString().split("T")[0];
      const fileName = `Triton_${businessSlug.replace(/\s+/g, "_")}_${clientName.replace(/[^a-z0-9]/gi, "_")}_${dateStr}.pdf`;
      const agreementName = `Triton Compliance  -  ${clientName}  -  ${businessSlug}`;

      const res = await fetch(backendUrl.replace(/\/$/, "") + "/api/adobe-sign/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pdfBase64, fileName, agreementName, signers, message }),
      });
      const json = await res.json();
      if (!res.ok || !json.ok) throw new Error(json.error || `HTTP ${res.status}`);
      setResult(json);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(15,23,42,0.65)" }}>
      <div className="bg-white rounded-lg shadow-xl max-w-xl w-full max-h-[90vh] overflow-y-auto">
        <div className="bg-navy text-white px-5 py-3 flex justify-between items-center">
          <h3 className="font-bold text-lg">Send via Adobe Sign</h3>
          <button onClick={onClose} className="text-white hover:text-gold text-2xl leading-none">&times;</button>
        </div>
        <div className="p-5 space-y-3">
          {result ? (
            <div className="bg-green-50 border border-green-300 text-green-900 rounded p-4">
              <div className="font-bold mb-1">Agreement sent.</div>
              <div className="text-sm">Adobe Sign Agreement ID:</div>
              <div className="font-mono text-xs break-all">{result.agreementId}</div>
              <div className="text-sm mt-2">The first signer ({advisorEmail}) will receive an email from Adobe Sign shortly. Subsequent signers will be notified once each previous signer completes.</div>
              <button onClick={onClose} className="mt-3 px-4 py-2 bg-navy text-white rounded">Close</button>
            </div>
          ) : (
            <>
              <div className="text-sm text-gray-600">The portal will generate the full-form PDF, upload it to your Adobe Sign account, and create a sequential signing agreement (advisor first, then client(s)).</div>

              {/* Server / credential status */}
              <div className="rounded p-3 border" style={{
                background: !serverStatus ? "#f8f8f4" :
                  serverStatus.ok && serverStatus.hasClientId && serverStatus.hasClientSecret && serverStatus.hasRefreshToken ? "#ecfdf5" : "#fff4e5",
                borderColor: !serverStatus ? "#e5e7eb" :
                  serverStatus.ok && serverStatus.hasClientId && serverStatus.hasClientSecret && serverStatus.hasRefreshToken ? "#a7f3d0" : "#fbd38d"
              }}>
                <div className="flex items-center justify-between">
                  <div className="text-sm font-semibold">
                    {statusChecking && <span style={{ color: "#6b7280" }}>Checking backend…</span>}

                      serverStatus.hasClientId && serverStatus.hasClientSecret && serverStatus.hasRefreshToken

                        : <span style={{ color: "#92400e" }}>⚠ Backend running but Adobe Sign credentials missing</span>
                    )}
                  </div>

                </div>
                {serverStatus && !serverStatus.ok && (
                  <div className="text-xs mt-1 text-red-700">{serverStatus.error || "Could not reach backend. Is `npm start` running in the server/ folder?"}</div>
                )}
                {serverStatus && serverStatus.ok && (!serverStatus.hasClientId || !serverStatus.hasClientSecret || !serverStatus.hasRefreshToken) && (
                  <div className="text-xs mt-2 text-amber-800 space-y-1">

                  </div>

              </div>

              <Field label="Backend URL"><TextInput value={backendUrl} onChange={setBackendUrl} placeholder="http://localhost:3000"/></Field>
              <div className="grid md:grid-cols-2 gap-2">
                <Field label="Advisor Name" required><TextInput value={advisorName} onChange={setAdvisorName}/></Field>
                <Field label="Advisor Email" required><TextInput type="email" value={advisorEmail} onChange={setAdvisorEmail}/></Field>

                <Field label="Client 1 Email" required><TextInput type="email" value={client1Email} onChange={setClient1Email}/></Field>

              <div className="flex justify-end gap-2 pt-2 border-t">
                <button onClick={onClose} className="px-4 py-2 border border-gray-400 rounded">Cancel</button>
                <button
                  onClick={handleSend}
                  disabled={busy || (serverStatus && !serverStatus.ok) || (serverStatus && (!serverStatus.hasClientId || !serverStatus.hasClientSecret || !serverStatus.hasRefreshToken))}
                  className="px-5 py-2 bg-gold text-navy font-semibold rounded hover:bg-yellow-500 disabled:opacity-50 disabled:cursor-not-allowed">
                  {busy ? "Sending..." : "Send"}
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
};

const blobToBase64 = (blob) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onloadend = () => {
    const r = reader.result;
    const base64 = typeof r === "string" ? r.replace(/^data:[^;]+;base64,/, "") : "";
    resolve(base64);
  };
  reader.onerror = reject;
  reader.readAsDataURL(blob);
});
const fileToDataUrl = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = reject;
  reader.readAsDataURL(file);
});
const fileToArrayBuffer = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.onerror = reject;
  reader.readAsArrayBuffer(file);
});
const reasonWhyHasAttachment = (reasonWhy) => {
  const attachment = makeReasonWhy(reasonWhy).attachment;
  return (attachment.kind === "pdf" && !!attachment.dataUrl) || (attachment.kind === "docx" && hasText(attachment.text));
};
const effectiveReasonWhyData = (data) => {
  if (data?.businessType !== "Segregated Fund Investment") return data;
  const sf = data.segregatedFundInvestment || {};
  const rw = makeReasonWhy(sf.reasonWhy);
  if (reasonWhyHasAttachment(rw) || !rw.accountType) return data;
  if (rw.include !== false && hasText(rw.body)) return data;
  const effectiveData = deepClone(data);
  const effectiveReasonWhy = {
    ...rw,
    include: true,
    body: hasText(rw.body) ? rw.body : generateReasonWhyBody(effectiveData),
    generatedAccountType: rw.accountType,
  };
  effectiveData.segregatedFundInvestment.reasonWhy = effectiveReasonWhy;
  effectiveReasonWhy.sourceSnapshot = reasonWhySourceSnapshot(effectiveData);
  return effectiveData;
};
const mergePdfAttachment = async (jsPdf, attachment) => {
  if (attachment?.kind !== "pdf" || !attachment.dataUrl) return jsPdf.output("blob");
  if (!window.PDFLib?.PDFDocument) throw new Error("PDF attachment support failed to load. Please refresh and try again.");
  const { PDFDocument } = window.PDFLib;
  const mainBytes = await jsPdf.output("blob").arrayBuffer();
  const attachmentBytes = await (await fetch(attachment.dataUrl)).arrayBuffer();
  const mainDoc = await PDFDocument.load(mainBytes);
  const attachmentDoc = await PDFDocument.load(attachmentBytes);
  const originalPageCount = mainDoc.getPageCount();
  const attachmentPageCount = attachmentDoc.getPageCount();
  const attachmentPages = await mainDoc.copyPages(attachmentDoc, attachmentDoc.getPageIndices());
  attachmentPages.forEach(page => mainDoc.addPage(page));
  if (mainDoc.getPageCount() !== originalPageCount + attachmentPageCount) {
    throw new Error("The attached Reason Why PDF could not be merged into the final PDF.");
  }
  const mergedBytes = await mainDoc.save();
  return new Blob([mergedBytes], { type: "application/pdf" });
};
const saveBlobAs = (blob, filename) => {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

const hashText = async (value) => {
  const bytes = new TextEncoder().encode(value);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, "0")).join("");
};

const ChangePasswordModal = ({ open, onClose }) => {
  const [currentPassword, setCurrentPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [message, setMessage] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  if (!open) return null;

  const submit = async (e) => {
    e.preventDefault();
    setBusy(true);
    setMessage("");
    setError("");
    try {
      const currentHash = await hashText(currentPassword);
      if (currentHash !== getActivePasswordHash()) {
        setError("Current password is incorrect · 当前密码不正确");
        return;
      }
      if (newPassword.length < 8) {
        setError("New password must be at least 8 characters · 新密码至少 8 位");
        return;
      }
      if (newPassword !== confirmPassword) {
        setError("New passwords do not match · 两次新密码不一致");
        return;
      }
      const newHash = await hashText(newPassword);
      localStorage.setItem(AUTH_CUSTOM_PASSWORD_HASH_KEY, newHash);
      sessionStorage.setItem(AUTH_KEY, "ok");
      setMessage("Password changed on this browser · 密码已在此浏览器更新");
      setCurrentPassword("");
      setNewPassword("");
      setConfirmPassword("");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4" style={{ background: "rgba(11,30,63,0.55)" }}>
      <div className="bg-white rounded-lg border border-gray-200 w-full max-w-md p-6" style={{ boxShadow: "0 24px 70px rgba(0,0,0,0.24)" }}>

        </div>
